spring.application.name=procucev-transcription-service-dev

server.port=${PORT:8080}

# H2 In-Memory Database (for instant testing without MySQL daemon)
spring.datasource.url=jdbc:h2:mem:procucev_transcription;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

gemini.api.key=${GEMINI_API_KEY:}
